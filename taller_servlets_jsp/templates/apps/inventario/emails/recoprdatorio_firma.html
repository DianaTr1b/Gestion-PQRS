<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #ffc107; color: #000; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { background-color: #fff3cd; padding: 20px; border: 1px solid #ffc107; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #ffc107; color: #000; text-decoration: none; border-radius: 5px; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>⏰ Recordatorio: Firma Pendiente</h2>
    </div>
    <div class="content">
        <p>Hola {{ usuario.nombre }},</p>
        <p>Tienes un documento pendiente de firma:</p>
        <p><strong>Movimiento #{{ movimiento.id }}</strong> - {{ movimiento.get_tipo_movimiento_display }}</p>
        <center>
            <a href="{{ base_url }}{% url 'inventario:movimiento_detalle' movimiento.id %}" class="btn">
                Ir a Firmar Documento
            </a>
        </center>
    </div>
</body>
</html>
